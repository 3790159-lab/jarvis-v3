<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Task Studio v2</title>
    <style>
        /* Dark Modern Dashboard UI */
        body {
            font-family: Arial, sans-serif;
            background-color: #333;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-control {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
        }
        
        .btn-primary {
            background-color: #4CAF50;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .btn-primary:hover {
            background-color: #3e8e41;
        }
        
        .stats-card {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        
        .progress-bar {
            height: 10px;
            background-color: #4CAF50;
            border-radius: 5px;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Jarvis Task Studio v2</h1>
        <form id="task-form">
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" class="form-control" rows="5" required></textarea>
            </div>
            <div class="form-group">
                <label for="priority">Priority:</label>
                <select id="priority" class="form-control" required>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div class="form-group">
                <label for="category">Category:</label>
                <select id="category" class="form-control" required>
                    <option value="work">Work</option>
                    <option value="personal">Personal</option>
                </select>
            </div>
            <div class="form-group">
                <label for="due-date">Due Date:</label>
                <input type="date" id="due-date" class="form-control" required>
            </div>
            <button type="submit" class="btn-primary">Add Task</button>
        </form>
        <h2>Search:</h2>
        <input type="text" id="search" class="form-control">
        <button type="button" class="btn-primary" onclick="searchTasks()">Search</button>
        <div class="status-filter">
            <label for="status">Status:</label>
            <select id="status" class="form-control">
                <option value="all">All</option>
                <option value="done">Done</option>
                <option value="pending">Pending</option>
            </select>
        </div>
        <div class="priority-filter">
            <label for="priority-filter">Priority:</label>
            <select id="priority-filter" class="form-control">
                <option value="all">All</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
        </div>
        <div class="sort-selector">
            <label for="sort">Sort:</label>
            <select id="sort" class="form-control">
                <option value="due-date">Due Date</option>
                <option value="title">Title</option>
            </select>
        </div>
        <button type="button" class="btn-primary" onclick="markDone()">Mark Done</button>
        <button type="button" class="btn-primary" onclick="undo()">Undo</button>
        <button type="button" class="btn-primary" onclick="deleteTask()">Delete</button>
        <div class="stats-card">
            <h3>Stats:</h3>
            <p id="total-tasks">Total Tasks: 0</p>
            <p id="done-tasks">Done Tasks: 0</p>
            <div class="progress-bar" id="completion-progress"></div>
        </div>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let searchQuery = '';

        function addTask(title, description, priority, category, dueDate) {
            const task = {
                title,
                description,
                priority,
                category,
                dueDate,
                status: 'pending'
            };
            tasks.push(task);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function searchTasks() {
            searchQuery = document.getElementById('search').value;
            const filteredTasks = tasks.filter(task => task.title.includes(searchQuery) || task.description.includes(searchQuery));
            renderTasks(filteredTasks);
        }

        function markDone() {
            const doneTasks = tasks.filter(task => task.status === 'done');
            localStorage.setItem('tasks', JSON.stringify(tasks.map(task => task.status === 'done' ? { ...task, status: 'done' } : task)));
            renderTasks();
            updateCompletionProgress();
        }

        function undo() {
            const undoneTasks = tasks.filter(task => task.status === 'done');
            localStorage.setItem('tasks', JSON.stringify(tasks.map(task => task.status === 'pending')));
            renderTasks();
            updateCompletionProgress();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks(filteredTasks = tasks) {
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';
            filteredTasks.forEach((task, index) => {
                const taskElement = document.createElement('div');
                taskElement.classList.add('task');
                taskElement.innerHTML = `
                    <h3>${task.title}</h3>
                    <p>Due Date: ${task.dueDate}</p>
                    <p>Priority: ${task.priority}</p>
                    <p>Category: ${task.category}</p>
                    <button class="btn-primary" onclick="markDone(${index})">Mark Done</button>
                    <button class="btn-primary" onclick="deleteTask(${index})">Delete</button>
                `;
                taskList.appendChild(taskElement);
            });
        }

        function updateCompletionProgress() {
            const doneTasks = tasks.filter(task => task.status === 'done');
            const completionPercentage = (doneTasks.length / tasks.length) * 100;
            document.getElementById('completion-progress').style.width = `${completionPercentage}%`;
            document.getElementById('total-tasks').innerText = `Total Tasks: ${tasks.length}`;
            document.getElementById('done-tasks').innerText = `Done Tasks: ${doneTasks.length}`;
        }

        function exportJSON() {
            const json = JSON.stringify(tasks, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tasks.json';
            a.click();
        }

        function importJSON(json) {
            tasks = JSON.parse(json);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }
    </script>
</body>
</html>
