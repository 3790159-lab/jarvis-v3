<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Mini App</title>
    <style>
        body {
            background-color: #333;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        input[type="text"] {
            width: 100%;
            height: 30px;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #444;
            color: #fff;
        }

        button {
            width: 100%;
            height: 40px;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            background-color: #555;
            color: #fff;
            cursor: pointer;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task {
            padding: 10px;
            border-bottom: 1px solid #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-done {
            text-decoration: line-through;
        }

        .task-delete {
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Jarvis Mini App</h1>
        <input type="text" id="task-input" placeholder="Enter a task...">
        <button onclick="addTask()">Add Task</button>
        <ul class="task-list"></ul>
        <p>Total Tasks: <span id="total-tasks">0</span></p>
        <p>Completed Tasks: <span id="completed-tasks">0</span></p>
    </div>

    <script>
        let tasks = [];
        let totalTasks = 0;
        let completedTasks = 0;

        function addTask() {
            const taskInput = document.getElementById('task-input');
            if (taskInput.value.trim() !== '') {
                const task = taskInput.value.trim();
                tasks.push(task);
                totalTasks++;
                updateUI();
                taskInput.value = '';
            }
        }

        function markTaskAsDone(index) {
            tasks[index].split(',').forEach((task, i) => {
                if (i === index) {
                    completedTasks++;
                    document.querySelector('.task-done').classList.add('done');
                    document.querySelector('.task-delete').textContent = 'Unmark';
                } else {
                    document.querySelector('.task-done').classList.remove('done');
                    document.querySelector('.task-delete').textContent = 'Mark';
                }
            });
            updateUI();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            totalTasks--;
            completedTasks -= tasks[index].split(',').filter((t) => t === tasks[index]).length;
            updateUI();
        }

        function updateUI() {
            const taskList = document.querySelector('.task-list');
            taskList.innerHTML = '';
            for (let i = 0; i < tasks.length; i++) {
                const taskElement = document.createElement('li');
                taskElement.classList.add('task');
                if (tasks[i].split(',').length > 1) {
                    taskElement.textContent = `${tasks[i].split(',')[0]} (${tasks[i].split(',')[1]})`;
                } else {
                    taskElement.textContent = tasks[i];
                }
                const deleteButton = document.createElement('button');
                deleteButton.classList.add('task-delete');
                deleteButton.textContent = 'Mark';
                deleteButton.onclick = () => markTaskAsDone(i);
                const doneButton = document.createElement('button');
                doneButton.classList.add('task-done');
                if (tasks[i].split(',').length > 1) {
                    doneButton.textContent = 'Unmark';
                } else {
                    doneButton.textContent = 'Mark';
                }
                doneButton.onclick = () => markTaskAsDone(i);
                taskElement.appendChild(deleteButton);
                taskElement.appendChild(doneButton);
                taskList.appendChild(taskElement);
            }
            document.getElementById('total-tasks').textContent = totalTasks;
            document.getElementById('completed-tasks').textContent = completedTasks;
        }

        updateUI();
    </script>
</body>
</html>
