<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jarvis Operator Dashboard</title>
<style>
body{margin:0;background:#0f172a;color:#e5e7eb;font-family:Arial,sans-serif}
header{padding:28px;background:#111827}
main{padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:#1f2937;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ok{color:#22c55e}.warn{color:#f59e0b}.bad{color:#ef4444}
small{color:#94a3b8}
</style>
</head>
<body>
<header>
<h1>Jarvis Operator Dashboard</h1>
<p>Evidence, queue, tools, night mode, n8n, GitHub and FULL CREATOR.</p>
</header>
<main>
<section class="card"><small>Backend</small><h2 class="ok">Healthy</h2></section>
<section class="card"><small>Evidence</small><h2 class="ok">Passed</h2></section>
<section class="card"><small>Gateway</small><h2 class="ok">98 Tools</h2></section>
<section class="card"><small>Queue</small><h2 class="warn">Review Pending</h2></section>
<section class="card"><small>n8n</small><h2 class="ok">Pipelines Ready</h2></section>
<section class="card"><small>Claude/GitHub</small><h2 class="warn">Safe Gate</h2></section>
</main>
</body>
</html>
