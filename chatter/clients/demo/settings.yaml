# switch to claude-sonnet-5 here if Haiku isn't lively enough
model: claude-haiku-4-5
language: ru
owner_id: "Дмитрий"
persona_name: "Аня"
work_hours: {start: 9, end: 22}
timings:
  read_delay_min: 1.5
  read_delay_max: 4.0
  cps_min: 4.0
  cps_max: 7.0
  jitter_min: 0.9
  jitter_max: 1.2
  split_pause_min: 0.6
  split_pause_max: 1.8
  split_max_len: 160
  night_multiplier: 2.5
  debounce_window: 3.0
  debounce_max: 15.0
limits: {max_reply_tokens: 20000, per_contact_hourly: 20, daily_cap: 500}
telegram:
  allowlist: [237616472]
  # Арка 3C — перевёрнутый гейт допуска. ПО УМОЛЧАНИЮ ВЫКЛЮЧЕН (funnel_gate off =
  # старое поведение: Аня отвечает ТОЛЬКО allowlist). Включать ТОЛЬКО на аккаунте,
  # ВЫДЕЛЕННОМ под воронку (не личном!) — тогда Аня отвечает незнакомцам-лидам,
  # знакомым (User.contact) НЕ отвечает (уведомляет владельца в пульт), denylist
  # блокирует. allowlist остаётся override «всегда отвечать» (тест/VIP-лид-контакт).
  # denylist: [123456]      # id, которым НИКОГДА не отвечать
  # funnel_gate: true       # ← подтверждение «аккаунт выделен под воронку»
# Арка 3B — контрол-бот + эскалация. ПОКА ЗАКОММЕНТИРОВАНО: без токена продукт
# работает ровно как арка 3A (пульт в Saved Messages). Чтобы включить:
#   1) создать бота в BotFather, положить токен в .env под именем из
#      control_bot_token_env;
#   2) раскомментировать блок ниже;
#   3) привязать владельца ОДНИМ из двух способов (TOFU УБРАН — публичный
#      юзернейм бота не должен делать «первого нашедшего» владельцем):
#      • owner_chat_id: жёсткий id-гейт. Владелец жмёт /start, /start от чужого
#        id отклоняется. Самый строгий; id — не секрет, коммитить безопасно.
#      • pairing_code: одноразовый код. Дай клиенту deep-link
#        t.me/<bot>?start=<код> — тап сам шлёт /start <код>, вводить ничего не
#        надо. Код сгорает после привязки. Charset [A-Za-z0-9_-], ≤64.
#   Привязка живёт в SQLite (переживает рестарт); второй /start её не перебивает,
#   разрыв — только /unbind от владельца.
control:
  control_bot_token_env: CHATTER_CONTROL_BOT_TOKEN   # ИМЯ env-переменной, НЕ токен
  owner_chat_id: 237616472        # demo: жёсткий id-гейт (мой chat_id)
  # pairing_code: onboard-demo-01 # альтернатива для онбординга клиента (deep-link)
  classifier_enabled: true        # дешёвый LLM-классификатор эскалации (только на реальном LLM)
  classifier_error_threshold: 5   # > стольких ошибок/окно → алерт «классификатор деградировал»
  snooze_seconds: 3600            # кнопка «⏸ Ещё 1ч»
