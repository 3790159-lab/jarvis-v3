# СТОИТ sonnet-5, и это НЕ «дороже ради качества» — это ДЕШЕВЛЕ.
# Стабильный префикс классификатора у demo — 3021 токенов по haiku-4-5
# (замер 19.08 в боевой форме, со слотом обязательств), а порог включения
# prompt-кэша у haiku — 4096. Ниже порога кэш выключается МОЛЧА: ни ошибки,
# ни лога, единственный след — cache_creation_input_tokens == 0, и каждый
# вызов платит полный вход вместо чтения по 0.1×. Втрое дешёвый токен не
# окупает десятикратный вход. У sonnet-5 порог 1024, префикс по его
# токенизатору 3504 — кэш работает.
# Вернуть haiku можно, только нарастив плейбук demo выше 4096 токенов;
# иначе сторож §2.2 (chatter/core/prefix_budget.py) откажется поднимать
# клиента — и будет прав.
model: claude-sonnet-5
language: ru
owner_id: "Дмитрий"
persona_name: "Аня"
# Brand-safety (валюта/оплата клиента). Украинский бизнес: гривна + украинские
# банки. forbidden_terms — жёсткий запрет: упоминание в ответе → Аня подавляет
# и эскалирует владельцу, без исключений (ляпнуть покупателю про рубли/росбанк =
# уничтожить репутацию клиента).
currency: "грн"
# Только однозначно российские термины (без «мир»/«альфа» — слишком широкие
# подстроки, дали бы ложные срабатывания на «в мире», укр. Alfa и т.п.).
forbidden_terms: ["рубл", "руб.", "₽", "сбербанк", "тинькофф", "тінькофф", "qiwi", "киви", "юмани", "yoomoney", "сбп", "система быстрых платеж"]
# Чем заменить подавленный ответ про оплату: подавление ≠ тишина. Лид получает
# корректный ответ (верные способы), без запрещённого слова, + владелец в пульте.
safe_payment_reply: "Оплата удобно через Monobank или ПриватБанк — скину реквизиты. Подскажу по любому вопросу оплаты."
# --- Два тумблера под ответственность владельца. Дефолты БЕЗОПАСНЫЕ. --------
# strict_knowledge: true (дефолт) — Аня говорит только из knowledge.md, обещание
#   вне базы подавляется и эскалируется. false — свободный режим: обещание
#   доходит до лида, карточка владельцу остаётся. Выдуманные ЦЕНЫ/СРОКИ и
#   forbidden_terms подавляются в ОБОИХ режимах.
# strict_knowledge: false
#
# honesty_mode: honest (дефолт) — на «ты бот?» раскрывается честно. Снять
#   гарантию можно только полным значением free_owner_liability (короткое
#   `free` отклоняется намеренно); включение пишется в лог.
# honesty_mode: free_owner_liability

work_hours: {start: 9, end: 22}
timings:
  read_delay_min: 1.5
  read_delay_max: 4.0
  cps_min: 4.0
  cps_max: 7.0
  jitter_min: 0.9
  jitter_max: 1.2
  split_pause_min: 0.6
  split_pause_max: 1.8
  split_max_len: 160
  night_multiplier: 2.5
  debounce_window: 3.0
  debounce_max: 15.0
limits: {max_reply_tokens: 20000, per_contact_hourly: 20, daily_cap: 500}
telegram:
  allowlist: [237616472]
  # Арка 3C — перевёрнутый гейт допуска. ПО УМОЛЧАНИЮ ВЫКЛЮЧЕН (funnel_gate off =
  # старое поведение: Аня отвечает ТОЛЬКО allowlist). Включать ТОЛЬКО на аккаунте,
  # ВЫДЕЛЕННОМ под воронку (не личном!) — тогда Аня отвечает незнакомцам-лидам,
  # знакомым (User.contact) НЕ отвечает (уведомляет владельца в пульт), denylist
  # блокирует. allowlist остаётся override «всегда отвечать» (тест/VIP-лид-контакт).
  # denylist: [123456]      # id, которым НИКОГДА не отвечать
  # funnel_gate: true       # ← подтверждение «аккаунт выделен под воронку»
# Арка 3B — контрол-бот + эскалация. ПОКА ЗАКОММЕНТИРОВАНО: без токена продукт
# работает ровно как арка 3A (пульт в Saved Messages). Чтобы включить:
#   1) создать бота в BotFather, положить токен в .env под именем из
#      control_bot_token_env;
#   2) раскомментировать блок ниже;
#   3) привязать владельца ОДНИМ из двух способов (TOFU УБРАН — публичный
#      юзернейм бота не должен делать «первого нашедшего» владельцем):
#      • owner_chat_id: жёсткий id-гейт. Владелец жмёт /start, /start от чужого
#        id отклоняется. Самый строгий; id — не секрет, коммитить безопасно.
#      • pairing_code: одноразовый код. Дай клиенту deep-link
#        t.me/<bot>?start=<код> — тап сам шлёт /start <код>, вводить ничего не
#        надо. Код сгорает после привязки. Charset [A-Za-z0-9_-], ≤64.
#   Привязка живёт в SQLite (переживает рестарт); второй /start её не перебивает,
#   разрыв — только /unbind от владельца.
control:
  control_bot_token_env: CHATTER_CONTROL_BOT_TOKEN   # ИМЯ env-переменной, НЕ токен
  owner_chat_id: 237616472        # demo: жёсткий id-гейт (мой chat_id)
  # pairing_code: onboard-demo-01 # альтернатива для онбординга клиента (deep-link)
  classifier_enabled: true        # дешёвый LLM-классификатор эскалации (только на реальном LLM)
  # УГОВОР 2026-07-23: три дня подряд с алертом = чиним КОРЕНЬ классификатора,
  # а НЕ поднимаем порог (спека 2026-07-23-chatter-classifier-reliability.md §5).
  classifier_error_threshold: 2   # столько сбоев/окно (считая спасённые ретраем) → алерт
  profile_stale_threshold: 3      # столько ПОДРЯД пропусков профиля по одному лиду → алерт
  snooze_seconds: 3600            # кнопка «⏸ Ещё 1ч»
