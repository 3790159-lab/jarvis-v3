# Персона Ольги — жива україномовна воронка з дзеркаленням мови ліда,
# тому Haiku тут замало: беремо sonnet-5 (demo лишається на haiku).
model: claude-sonnet-5
# language — ОДНА скалярка, і вона ж глобально задає мову карточок ескалації
# у пульті (build_runner бере control/language ПЕРВИННОЇ персони). uk = картки
# українською. Дзеркалення мови ліда (укр/рос) живе в persona.md, бо окремої
# налаштування під двомовність у коді немає.
language: uk
owner_id: "Керівниця"
# Як НАЗВАТИ власника ліду — вже у потрібному відмінку («зв'яжу вас з
# керівницею»). owner_id не відмінюємо, бо «зв'яжу вас з Керівниця» криво.
owner_ref: "керівницею"
persona_name: "Ольга"
# Brand-safety. Ціни агенції — в доларах США.
currency: "$"
# Тільки однозначно російські платіжні терміни (без «мир»/«альфа» — надто
# широкі підрядки, дали б хибні спрацювання). Згадка в ВІДПОВІДІ → Ольга
# подавляє відповідь і ескалує керівниці.
forbidden_terms: ["рубл", "руб.", "₽", "сбербанк", "тинькофф", "тінькофф", "qiwi", "киви", "юмани", "yoomoney", "сбп", "система быстрых платеж"]
# Чим замінити подавлену відповідь про оплату: подавлення ≠ тиша.
safe_payment_reply: "Оплата можлива через Upwork, PayPal, Wise або переказом на доларовий чи євро-рахунок (IBAN). Конкретні реквізити надішле керівниця — передам їй ваше питання."
# strict_knowledge: true (дефолт, НЕ чіпаємо) — Ольга говорить лише з
#   knowledge.md; вигадані ЦІНИ/ТЕРМІНИ подавляються і ескалуються. Саме це
#   тримає «не вигадувати цін і термінів» з ТЗ.
# honesty_mode: honest (дефолт, НЕ чіпаємо) — на «ти бот?» розкривається чесно.

work_hours: {start: 9, end: 20}
timings:
  read_delay_min: 1.5
  read_delay_max: 4.0
  cps_min: 4.0
  cps_max: 7.0
  jitter_min: 0.9
  jitter_max: 1.2
  split_pause_min: 0.6
  split_pause_max: 1.8
  split_max_len: 160
  night_multiplier: 2.5
  debounce_window: 3.0
  debounce_max: 15.0
limits: {max_reply_tokens: 20000, per_contact_hourly: 20, daily_cap: 500}
telegram:
  # allowlist = override «ВІДПОВІДАТИ ЗАВЖДИ», і він б'є перевірку на контакт
  # (admission.py: denylist > allowlist > contact > stranger). Саме тому твій
  # id тут ОБОВ'ЯЗКОВИЙ: без нього ти як збережений контакт акаунта отримав би
  # notify_owner замість відповіді — і тестовий прогін не відбувся б.
  allowlist: [237616472]
  # Арка 3C — перевернутий гейт допуска: true = незнайомцям-лідам Ольга
  # відповідає, знайомим (User.contact) НЕ відповідає — власник отримує
  # сповіщення в пульт, denylist блокує тихо.
  #
  # ВИМКНЕНО. Це значення — ФАКТ, не ціль: цільовий стан у файл наперед НЕ
  # вписується (гардіан деплоїть з робочого дерева, ребут підняв би раннер із
  # відкритим гейтом без команди власника). Причина обережності:
  # catch_up_missed на старті сканує непрочитані діалоги за 24 год
  # (CATCHUP_MAX_AGE_SECONDS) і жене їх через ЦЕЙ САМИЙ гейт (select_missed) —
  # з gate=true Ольга віялом відповіла б усім незнайомцям за добу ПРЯМО НА
  # СТАРТІ. З gate=false відповідає лише allowlist.
  #
  # УВІМКНЕННЯ — ТІЛЬКИ окремим свідомим кроком власника, командою пульта,
  # БЕЗ рестарту і без правки файлу:
  #     /funnel_gate on confirm
  # (пише сюди через set_funnel_gate і перезавантажує конфіг; при збої
  # відкочує файл назад). Вимкнути назад: /funnel_gate off
  funnel_gate: false
  # denylist: [123456]      # id, яким НІКОЛИ не відповідати
control:
  control_bot_token_env: CHATTER_CONTROL_BOT_TOKEN   # ІМ'Я env-змінної, НЕ токен
  owner_chat_id: 237616472        # жорсткий id-гейт: картки Ольги йдуть тобі
  classifier_enabled: true        # дешевий LLM-класифікатор ескалації
  # Стільки збоїв класифікатора за добу (разом із врятованими повтором) → алерт.
  # Було 5 і порівняння «строго більше»: фактичні 2 збої 23.07 (з 14 викликів)
  # не дали б алерту НІКОЛИ — вони просто копилися в БД, яку ніхто не читає.
  classifier_error_threshold: 2
  # Стільки ПОСПІЛЬ пропущених оновлень профілю по ОДНОМУ контакту → окремий
  # алерт: пам'ять ліда замерзла в живому діалозі.
  profile_stale_threshold: 3
  snooze_seconds: 3600            # кнопка «⏸ Ще 1 год»
honesty_mode: honest
