# Персона Ольги — жива україномовна воронка з дзеркаленням мови ліда,
# тому Haiku тут замало: беремо sonnet-5 (demo лишається на haiku).
model: claude-sonnet-5
# language — ОДНА скалярка, і вона ж глобально задає мову карточок ескалації
# у пульті (build_runner бере control/language ПЕРВИННОЇ персони). uk = картки
# українською. Дзеркалення мови ліда (укр/рос) живе в persona.md, бо окремої
# налаштування під двомовність у коді немає.
language: uk
owner_id: "Керівниця"
# Як НАЗВАТИ власника ліду — вже у потрібному відмінку («зв'яжу вас з
# керівницею»). owner_id не відмінюємо, бо «зв'яжу вас з Керівниця» криво.
owner_ref: "керівницею"
persona_name: "Ольга"
# Brand-safety. Ціни агенції — в доларах США.
currency: "$"
# Тільки однозначно російські платіжні терміни (без «мир»/«альфа» — надто
# широкі підрядки, дали б хибні спрацювання). Згадка в ВІДПОВІДІ → Ольга
# подавляє відповідь і ескалує керівниці.
forbidden_terms: ["рубл", "руб.", "₽", "сбербанк", "тинькофф", "тінькофф", "qiwi", "киви", "юмани", "yoomoney", "сбп", "система быстрых платеж"]
# Чим замінити подавлену відповідь про оплату: подавлення ≠ тиша.
safe_payment_reply: "Оплата можлива через Upwork, PayPal, Wise або переказом на доларовий чи євро-рахунок (IBAN). Конкретні реквізити надішле керівниця — передам їй ваше питання."
# strict_knowledge: true (дефолт, НЕ чіпаємо) — Ольга говорить лише з
#   knowledge.md; вигадані ЦІНИ/ТЕРМІНИ подавляються і ескалуються. Саме це
#   тримає «не вигадувати цін і термінів» з ТЗ.
# honesty_mode: honest (дефолт, НЕ чіпаємо) — на «ти бот?» розкривається чесно.

work_hours: {start: 9, end: 20}
timings:
  read_delay_min: 1.5
  read_delay_max: 4.0
  cps_min: 4.0
  cps_max: 7.0
  jitter_min: 0.9
  jitter_max: 1.2
  split_pause_min: 0.6
  split_pause_max: 1.8
  split_max_len: 160
  night_multiplier: 2.5
  debounce_window: 3.0
  debounce_max: 15.0
limits: {max_reply_tokens: 20000, per_contact_hourly: 20, daily_cap: 500}
telegram:
  # allowlist = override «ВІДПОВІДАТИ ЗАВЖДИ», і він б'є перевірку на контакт
  # (admission.py: denylist > allowlist > contact > stranger). Саме тому твій
  # id тут ОБОВ'ЯЗКОВИЙ: без нього ти як збережений контакт акаунта отримав би
  # notify_owner замість відповіді — і тестовий прогін не відбувся б.
  allowlist: [237616472]
  # Арка 3C — перевернутий гейт допуска: true = незнайомцям-лідам Ольга
  # відповідає, знайомим (User.contact) НЕ відповідає — власник отримує
  # сповіщення в пульт, denylist блокує тихо.
  #
  # ВИМКНЕНО. Це значення — ФАКТ, не ціль: цільовий стан у файл наперед НЕ
  # вписується (гардіан деплоїть з робочого дерева, ребут підняв би раннер із
  # відкритим гейтом без команди власника). Причина обережності:
  # catch_up_missed на старті сканує непрочитані діалоги за 24 год
  # (CATCHUP_MAX_AGE_SECONDS) і жене їх через ЦЕЙ САМИЙ гейт (select_missed) —
  # з gate=true Ольга віялом відповіла б усім незнайомцям за добу ПРЯМО НА
  # СТАРТІ. З gate=false відповідає лише allowlist.
  #
  # УВІМКНЕННЯ — ТІЛЬКИ окремим свідомим кроком власника, командою пульта,
  # БЕЗ рестарту і без правки файлу:
  #     /funnel_gate on confirm
  # (пише сюди через set_funnel_gate і перезавантажує конфіг; при збої
  # відкочує файл назад). Вимкнути назад: /funnel_gate off
  funnel_gate: false
  # denylist: [123456]      # id, яким НІКОЛИ не відповідати
control:
  control_bot_token_env: CHATTER_CONTROL_BOT_TOKEN   # ІМ'Я env-змінної, НЕ токен
  owner_chat_id: 237616472        # жорсткий id-гейт: картки Ольги йдуть тобі
  classifier_enabled: true        # дешевий LLM-класифікатор ескалації
  # Стільки збоїв класифікатора за добу (разом із врятованими повтором) → алерт.
  # Було 5 і порівняння «строго більше»: фактичні 2 збої 23.07 (з 14 викликів)
  # не дали б алерту НІКОЛИ — вони просто копилися в БД, яку ніхто не читає.
  # УГОВОР 2026-07-23: якщо алерт спрацьовує ТРИ ДНІ ПОСПІЛЬ — лагодимо
  # КОРІНЬ класифікатора (промпт/модель/формат), а НЕ піднімаємо поріг.
  # Сторож: tests/chatter/test_classifier.py::test_shipped_thresholds_*
  classifier_error_threshold: 2
  # Стільки ПОСПІЛЬ пропущених оновлень профілю по ОДНОМУ контакту → окремий
  # алерт: пам'ять ліда замерзла в живому діалозі.
  profile_stale_threshold: 3
  snooze_seconds: 3600            # кнопка «⏸ Ще 1 год»
honesty_mode: honest

# ── Оплата (спека 2026-08-10, Ф0) ────────────────────────────────────────────
# Ольга називає суму САМА (верх вилки прайсу з застереженням) і надсилає
# реквізити з конфігу. Реквізити живуть в ОКРЕМОМУ файлі requisites.yaml.
payments:
  # ЄДИНИЙ тумблер. Значення тут — ФАКТ, не ціль: гардіан деплоїть з робочого
  # дерева, і ввімкнена у файлі фіча піднялася б на ребуті БЕЗ команди
  # власника — рівно та сама причина, що у funnel_gate.
  # Вмикати: /payments on confirm  (вимкнути назад: /payments off)
  #
  # Поки requisites.yaml порожній, увімкнення ВПАДЕ на валідаторі старту і
  # відкотить файл. Так і задумано: оплата не вмикається до реальних реквізитів.
  enabled: false
  # Канали. Ф0 вміє тільки mode: manual — підтверджує оплату ЛИШЕ власник.
  # Upwork / PayPal / Wise з knowledge сюди НЕ виписані: це merchant-канали
  # (mode: auto), а обіцяти автопідтвердження на нереалізованій інтеграції —
  # ризик 10.3. Вони приходять у Ф2 разом із перевіркою живості провайдера.
  channels:
    - id: iban_usd
      kind: bank_transfer
      mode: manual
      currency: USD
      requisites_template: iban_usd
      display: "Переказ на доларовий рахунок (IBAN)"
    - id: iban_eur
      kind: bank_transfer
      mode: manual
      currency: EUR
      requisites_template: iban_eur
      display: "Переказ на євро-рахунок (IBAN)"
  # Строк оплати з ГОДИНОЮ («до 18:00 у пʼятницю, 14 серпня») — вимога власника.
  due_hours: 72
  # Антилуп. Це не «сума завелика», а «бот виставив 50 рахунків за годину».
  daily_invoice_cap: 20
  per_contact_invoice_cap: 3
  # Гейт «покликати керівницю» — за СКЛАДНІСТЮ запиту, не за сумою.
  escalate_on_complexity: true
  # Поріг за сумою — backstop на випадок описки в розряді прайсу, і він
  # ВИМКНЕНИЙ за замовчуванням (рішення власника 2). Вмикати свідомо:
  #   owner_approval_above: {amount: 1500, currency: USD}
  pricing:
    # Бот називає ВЕРХНЮ межу вилки з застереженням — і лише те число, що
    # опубліковане в knowledge.md. Валідатор старту звіряє межі вилки з
    # knowledge ЛІТЕРАЛЬНО: ціна, якої клієнт ніде не публікував, не прозвучить.
    amount_source: price_upper
    positions:
      # Торг — ДИСКРЕТНА СІТКА готових чисел, не арифметика: у готових чисел
      # немає жодної хвороби обчислених (їх не ріже guardrail large_number і
      # вони не чекають політики D v2). Підлога == нижня межа вилки прайсу,
      # нижче не буває НІКОЛИ.
      smm_month:
        title: "SMM-ведення (місяць)"
        currency: USD
        price_range: [750, 900]
        ladder:
          - {amount: 900, scope_key: smm_full}
          - {amount: 820, scope_key: smm_mid}
          - {amount: 750, scope_key: smm_floor}
      identity:
        title: "Створення айдентики"
        currency: USD
        price_range: [700, 900]
        ladder:
          - {amount: 900, scope_key: identity_full}
          - {amount: 800, scope_key: identity_mid}
          - {amount: 700, scope_key: identity_floor}
      strategy:
        title: "Маркетингова стратегія"
        currency: USD
        price_range: [600, 800]
        ladder:
          - {amount: 800, scope_key: strategy_full}
          - {amount: 600, scope_key: strategy_floor}
      packaging:
        title: "Упаковка"
        currency: USD
        price_range: [300, 400]
        ladder:
          - {amount: 400, scope_key: packaging_full}
          - {amount: 300, scope_key: packaging_floor}
      logo:
        title: "Створення логотипа"
        currency: USD
        price_range: [300, 400]
        ladder:
          - {amount: 400, scope_key: logo_full}
          - {amount: 300, scope_key: logo_floor}
      logo_refine:
        title: "Рефайн (редизайн) логотипа"
        currency: USD
        price_range: [200, 200]
        ladder:
          - {amount: 200, scope_key: logo_refine_only}
      presentation:
        title: "Створення презентації"
        currency: USD
        price_range: [100, 200]
        ladder:
          - {amount: 200, scope_key: presentation_full}
          - {amount: 100, scope_key: presentation_floor}
  # Текст «що змінюється» на кожній сходинці. Поступка без названого обміну —
  # це «мовчки дешевше» (ризик 10.12), тому ступінь без тексту валідатор не
  # пропускає взагалі.
  #
  # ВСЕ НИЖЧЕ — ЗАГЛУШКИ. `placeholder: true` — позначка ЯВНА: рядок, схожий на
  # TODO, заглушкою не вважається (вгадування зробило б валідатор
  # непередбачуваним в обидва боки). Поки позначка стоїть, ці сходинки
  # обслуговують ТІЛЬКИ дрил-контакти; живому ліду конфіг із заглушками не
  # проходить перевірку `assert_pricing_usable`.
  #
  # Замінити на формулювання Ольги і ЗНЯТИ `placeholder: true` — по одному
  # рядку, у міру того як тексти приходять.
  scope_texts:
    smm_full: {text: "ЗАГЛУШКА: повний обсяг ведення", placeholder: true}
    smm_mid: {text: "ЗАГЛУШКА: менше публікацій на місяць", placeholder: true}
    smm_floor: {text: "ЗАГЛУШКА: базовий обсяг ведення", placeholder: true}
    identity_full: {text: "ЗАГЛУШКА: повна айдентика з брендгайдом", placeholder: true}
    identity_mid: {text: "ЗАГЛУШКА: без частини носіїв", placeholder: true}
    identity_floor: {text: "ЗАГЛУШКА: базовий набір айдентики", placeholder: true}
    strategy_full: {text: "ЗАГЛУШКА: повна стратегія", placeholder: true}
    strategy_floor: {text: "ЗАГЛУШКА: скорочена стратегія", placeholder: true}
    packaging_full: {text: "ЗАГЛУШКА: повна упаковка", placeholder: true}
    packaging_floor: {text: "ЗАГЛУШКА: базова упаковка", placeholder: true}
    logo_full: {text: "ЗАГЛУШКА: логотип з варіаціями", placeholder: true}
    logo_floor: {text: "ЗАГЛУШКА: логотип в одному варіанті", placeholder: true}
    logo_refine_only: {text: "ЗАГЛУШКА: рефайн наявного логотипа", placeholder: true}
    presentation_full: {text: "ЗАГЛУШКА: презентація повного обсягу", placeholder: true}
    presentation_floor: {text: "ЗАГЛУШКА: скорочена презентація", placeholder: true}
