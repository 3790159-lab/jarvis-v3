# Книга реквізитів Ольги. ОКРЕМИЙ файл, а не секція settings.yaml: тумблер
# оплати правиться командою пульта (`/payments on confirm` переписує
# settings.yaml), і платіжні дані не мають лежати у файлі, який править робот.
#
# ДВІ РОЗДІЛЬНІ книги — розділення структурне, а не прапорцем усередині запису:
# переплутати «клієнтські» і «тестові» тоді можна лише правкою ключа верхнього
# рівня, а не опискою в булеві.
#
#   templates       — реквізити КЛІЄНТА. Їх бачить будь-який лід.
#   test_templates  — ТІЛЬКИ для дрил-контактів (chatter/payments/drill_gate.py).
#                     Живий лід сюди не заглядає ВЗАГАЛІ: «заглянути й не взяти»
#                     — за одну правку від «заглянути й взяти».
#
# ОБИДВІ ПОРОЖНІ НАВМИСНО. Реквізитів від Ольги ще немає, а вигадувати IBAN
# заборонено: помилка в одному символі — це гроші, що пішли не туди (ризик 10.5).
# Поки книги порожні, фіча ВВІМКНУТИСЯ НЕ МОЖЕ: `/payments on confirm` впаде на
# валідаторі старту («ввімкнено, а відповісти нічим») і відкотить файл. Це не
# незручність, а сторож: він не дає ввімкнути оплату до реальних реквізитів.
#
# ЯК ЗАПОВНИТИ (обидва шляхи безпечні, файл читається на `/reload`):
#
#   templates:
#     iban_usd:
#       body: |
#         Отримувач: ...
#         IBAN: ...
#         Призначення: ...
#     iban_eur:
#       body: |
#         ...
#
#   test_templates:          # для живого прогону Ф0 на дрил-контакті
#     iban_usd:
#       body: |
#         ТЕСТ. Реквізити для прогону, надані власником.
#
# Тіло з самих пробілів дорівнює відсутньому: «Реквізити: » у живому діалозі
# не з'явиться ніколи.
templates: {}
test_templates: {}
