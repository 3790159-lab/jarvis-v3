# ШАБЛОН книги реквизитов. Этот файл ТРЕКАЕТСЯ (в нём нет данных), а рабочий
# `requisites.yaml` — под .gitignore по маске `requisites.yaml`: это чужие
# банковские данные, и утечка в публичную историю не отзывается никогда.
#
# Скопировать рядом и заполнить:
#     cp requisites.example.yaml requisites.yaml
#
# Файла нет вовсе → книга пустая, выдавать нечего, оплата не включится. Это
# рабочее состояние, а не ошибка.
#
# ─────────────────────────────────────────────────────────────────────────────
# ФОРМАТ
#
# Два ключа верхнего уровня, оба необязательные:
#
#   templates       — реквизиты КЛИЕНТА. Их получает ЛЮБОЙ лид.
#   test_templates  — ТОЛЬКО для дрил-контактов. Живой лид сюда не заглядывает
#                     вообще: «заглянуть и не взять» — на одну правку от
#                     «заглянуть и взять».
#
# Дрил-контакты (константа `chatter/payments/drill_gate.py`, не настройка):
#     237616472:volska
#     8849893367:volska
# Любой другой контакт получает только `templates`; если их нет — ОТКАЗ
# (`RequisitesUnavailable`), фича молчит. Подставлять что-либо вместо
# реквизитов запрещено.
#
# КЛЮЧ записи = поле `requisites_template` канала из settings.yaml.
# У volska объявлены два канала:
#     iban_usd  — «Переказ на доларовий рахунок (IBAN)»
#     iban_eur  — «Переказ на євро-рахунок (IBAN)»
# Ключ, которого нет в книге, равен отсутствующему: канал просто не сможет
# ответить. Опечатка в ключе = молчание, а не ошибка старта.
#
# ЗНАЧЕНИЕ — либо строка, либо словарь с полем `body`. Читается ТОЛЬКО `body`.
# Это ловушка, которую стоит знать: `text:` вместо `body:` не ошибка — поле
# просто игнорируется, тело выходит пустым, и канал молча перестаёт отвечать.
#
# `body` — ДОСЛОВНО то, что увидит лид. Он подставляется в ответ на место
# служебного `{REQUISITES}` уже ПОСЛЕ модели и после guardrails, байт в байт,
# без переносов, склеек и правок. Модель этих символов не видит вовсе — именно
# поэтому она не может «поправить» IBAN.
#
# Тело из одних пробелов считается ОТСУТСТВУЮЩИМ: «Реквізити: » в живом диалоге
# не появится никогда.
#
# ─────────────────────────────────────────────────────────────────────────────

# Реквизиты клиента. Пока их нет — оставить пустым: templates: {}
templates:
  iban_usd:
    # `|` — многострочный блок: переносы сохраняются как есть.
    body: |
      Отримувач: <назва або ПІБ>
      IBAN: <IBAN доларового рахунку>
      SWIFT/BIC: <код банку>
      Банк: <назва банку>
      Призначення платежу: <що писати в призначенні>
  iban_eur:
    body: |
      Отримувач: <назва або ПІБ>
      IBAN: <IBAN євро-рахунку>
      SWIFT/BIC: <код банку>
      Банк: <назва банку>
      Призначення платежу: <що писати в призначенні>

# Тестовые реквизиты для живого прогона Ф0. Их даёт ВЛАДЕЛЕЦ, и уйти они могут
# только на дрил-контакт: попытка выдать их живому лиду — исключение
# `NotForProduction`, а не тихая подстановка.
#
# Инвариант, закреплённый перебором в тестах: `instruction.source == "test"`
# влечёт, что контакт дрил-овый.
test_templates:
  iban_usd:
    body: |
      ТЕСТ (прогін Ф0, реквізити власника).
      Отримувач: <...>
      IBAN: <...>
