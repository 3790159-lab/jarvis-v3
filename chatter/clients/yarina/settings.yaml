# DrivePro Detailing (Київ) — персона Ярина. Третій клієнт.
#
# Джерело: бриф C:\jarvis\.secrets\briefs\brief.xlsx (Google-форма, 08.08.2026).
# Рішення власника від 13.08.2026, які НЕ переобговорюються:
#   honesty_mode: honest, payments вимкнено, валюта грн, часовий пояс не пишемо.

# Жива україномовна воронка з кваліфікацією і торгом по вилці — haiku замало.
model: claude-sonnet-5
language: uk

# ── Хто є хто ────────────────────────────────────────────────────────────────
# Бриф Q16: власника називаємо «старший майстер». Q14 брифу просив звати
# персону «Джарвис» — це заглушка тестового заповнення, рішенням власника
# персона зветься Ярина.
owner_id: "Старший майстер"
# Як НАЗВАТИ власника ліду — вже у ПОТРІБНОМУ ВІДМІНКУ: шаблони фолбеків
# підставляють ref після прийменника («зв'яжу вас з {ref}»), тому тут
# ОРУДНИЙ відмінок. «нашим старшим» замість голого «старшим» — навмисно:
# українською правильно «зі старшим майстром», а шаблон дає «з {ref}», і
# «з нашим старшим майстром» читається без огріху.
owner_ref: "нашим старшим майстром"
persona_name: "Ярина"
persona_age: 26

# Валюта клієнта — гривня (бриф Q22, усі 14 позицій прайсу).
currency: "грн"

# ── Brand-safety: згадка в ВІДПОВІДІ → відповідь подавляється + картка ───────
# Два класи. Перший — платіжна лексика чужої юрисдикції (успадковано, коштує
# нуль). Другий — заборонені формулювання з брифу Q50, і вони ЗУМИСНЕ вписані
# ПОВНИМИ фразами, а не корінням: корінь «гарант» убив би легальну розмову про
# розділ «Гарантії та якість роботи», корінь «дешев» — легальне «якщо достатньо
# дешевшого рішення». Ціна хибного спрацювання = втрачена відповідь ліду.
#
# Апостроф у «обов'язково» даний у ДВОХ варіантах (U+0027 і U+2019): матч іде
# підрядком без нормалізації, і один варіант мовчки не спрацював би.
forbidden_terms: [
  "рубл", "руб.", "₽", "сбербанк", "тинькофф", "тінькофф", "qiwi", "киви",
  "юмани", "yoomoney", "сбп",
  "100% гарант", "100 % гарант", "гарантія результату", "гарантований результат",
  "буде як нова", "буде як новий", "ідеальний результат",
  "гарантовано прибер", "точно прибер", "приберемо всі подряпини",
  "захищає від усього", "захистить від усього",
  "ми №1", "ми номер 1", "найкращі майстри", "найкращий варіант на ринку",
  "конкуренти роблять гірше", "у конкурентів погані",
  "тільки сьогодні", "останнє місце",
  "ви повинні", "обов'язково потрібно", "обов’язково потрібно",
  # Протікання персони іншого клієнта: у DrivePro немає жодної «керівниці».
  # Якщо слово прозвучало — це не стиль, це чужий конфіг у промпті.
  "керівниц",
]
# Чим замінити подавлену відповідь про оплату: подавлення ≠ тиша.
safe_payment_reply: "Оплатити можна карткою або переказом у гривні, також приймаємо готівку. Реквізити надсилає старший майстер — передаю йому ваше питання."

# strict_knowledge: true (дефолт, НЕ чіпаємо) — Ярина говорить лише з
#   knowledge.md; вигадані ЦІНИ/ТЕРМІНИ подавляються і ескалуються.
#   УВАГА про межу цього захисту — див. DEV-28: перевіряються ЧИСЛА, а не
#   УТВЕРДЖЕННЯ. «Кераміка тримається 2–3 роки» проходить чисто.
# honesty_mode: honest — на «ти бот?» Ярина розкривається чесно.
#   Єдина альтернатива — ПОВНЕ значення 'free_owner_liability' (коротке 'free'
#   валідатор відкидає навмисно). Вмикати його = свідомо взяти на себе
#   відповідальність за те, що бот видає себе за людину; бриф Q15 просив саме
#   це, рішенням власника лишаємо honest.
honesty_mode: honest

# Робочі години студії (бриф Q12: 9-18). Це НЕ розклад бота: відповідає він
# цілодобово (бриф Q11), а work_hours впливають ЛИШЕ на темп друку —
# humanizer.is_night сповільнює відповіді вночі у night_multiplier разів.
work_hours: {start: 9, end: 18}
timings:
  read_delay_min: 1.5
  read_delay_max: 4.0
  cps_min: 4.0
  cps_max: 7.0
  jitter_min: 0.9
  jitter_max: 1.2
  split_pause_min: 0.6
  split_pause_max: 1.8
  split_max_len: 160
  night_multiplier: 2.5
  debounce_window: 3.0
  debounce_max: 15.0
limits: {max_reply_tokens: 20000, per_contact_hourly: 20, daily_cap: 500}

telegram:
  # allowlist = override «ВІДПОВІДАТИ ЗАВЖДИ», б'є перевірку на контакт.
  # Поки тут лише власник — на живі акаунти клієнта конфіг ще не націлений
  # (бриф Q8 «посилання на акаунти» заповнений словом «тест»).
  # ⚠️ Для дрил-прогона сюда временно добавляется id дрил-аккаунта: при
  # funnel_gate=false allowlist — ЕДИНСТВЕННЫЙ источник допуска
  # (`chatter/core/admission.py:30`), и без него бот молча игнорирует стенд —
  # выглядит как «бот не отвечает», а причина в гейте. Штатный способ —
  # `/allow <id>` в пульте, без правки файла. Прогон 14.08 сделан правкой,
  # строка снята сразу после.
  allowlist: [237616472]
  # ФАКТ, не ціль. Гардіан деплоїть з робочого дерева, тому ввімкнений у файлі
  # гейт піднявся б на ребуті БЕЗ команди власника. Плюс catch_up_missed на
  # старті жене через цей самий гейт непрочитане за добу — з gate=true бот
  # віялом відповів би всім незнайомцям ПРЯМО НА СТАРТІ.
  # Вмикати ТІЛЬКИ командою пульта: /funnel_gate on confirm
  funnel_gate: false
control:
  # ⚠️ СВОЯ env-змінна, НЕ спільна з Ольгою. Тут ІМ'Я змінної, НЕ токен.
  # Два раннери з ОДНАКОВИМ ім'ям читали б ОДИН токен і билися б за
  # getUpdates: Telegram віддає long-poll рівно одному споживачу, другий
  # отримує 409 Conflict, і команди пульта прилітали б то одному боту, то
  # іншому — навпіл, без жодної помилки в лозі.
  control_bot_token_env: CHATTER_CONTROL_BOT_TOKEN_YARINA
  # ЗМІНЕНО 19.08 за рішенням власника: це НЕ тільки картки — це жорсткий
  # id-гейт УСЬОГО пульта Ярини: кнопки, /allow, /funnel_gate, /config.
  # Ольга НЕ зачеплена: в неї свій settings.yaml, своя БД і свій токен.
  # ⚠️ Telegram не дає боту писати першим: поки цей id не натисне /start
  #    у контрол-бота Ярини, відправка карток буде падати.
  owner_chat_id: 545893540        # картки й пульт Ярини йдуть сюди
  classifier_enabled: true
  # УГОВІР 2026-07-23: алерт три дні поспіль → лагодимо КОРІНЬ класифікатора,
  # а НЕ піднімаємо поріг.
  classifier_error_threshold: 2
  profile_stale_threshold: 3
  snooze_seconds: 3600

# ── Оплата ───────────────────────────────────────────────────────────────────
# ВИМКНЕНО, і це рішення власника від 13.08.2026, а не заглушка «поки що»:
#   1) реквізитів клієнта немає взагалі — бриф Q31 прямо каже «реквізити
#      надсилаю тільки я», а requisites.yaml порожній;
#   2) Ф0 оплати має п'ять місць, зашитих під USD, і гривневий клієнт через
#      них не проходить.
# Поки блок вимкнений, Ярина називає лише СПОСОБИ оплати з knowledge.md
# (картка/переказ у гривні, готівка) і правило передоплати ЛІТЕРАЛОМ, а суму
# передоплати не рахує взагалі.
payments:
  enabled: false
