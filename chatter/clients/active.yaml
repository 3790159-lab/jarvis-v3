# Активные клиенты chatter: кого обслуживает раннер, запущенный ВРУЧНУЮ.
#
# ⚠️ ГАРДИАНОМ ЭТОТ ФАЙЛ БОЛЬШЕ НЕ ИСПОЛЬЗУЕТСЯ.
# Состав клиентов под гардианом — chatter/clients/registry.yaml (одна запись =
# один процесс со своими сессией, БД, логом и heartbeat). Причина: одному
# раннеру нельзя отдать N аккаунтов, а список персон здесь описывает ровно
# один процесс. Файл оставлен для ручного запуска и разовой отладки:
#     python -m chatter.telethon_run
#
# ПЕРВЫЙ в списке — первичный: он даёт allowlist, определяет язык пульта и
# пути рантайм-файлов (.secrets/<slug>.session, .secrets/<slug>.db).
#
# Разовое переопределение (не трогая файл):
#   python -m chatter.telethon_run --personas acme
#   CHATTER_PERSONAS=acme python -m chatter.telethon_run
clients:
  - demo
  - demo2
