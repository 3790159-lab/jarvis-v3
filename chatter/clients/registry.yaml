# Реестр клиентов chatter: КТО ДОЛЖЕН ЖИТЬ под гардианом (desired state).
#
# Одна запись = один процесс раннера со своими сессией, БД, логом и heartbeat.
# Внутри записи может быть несколько персон (personas: [demo, demo2]) — это
# сегодняшнее поведение одного раннера с несколькими персонами.
#
# Подключить клиента = добавить запись сюда. Правка PowerShell-скрипта гардиана
# НЕ требуется. Минимальная запись — две строки: пути выводятся из slug'а
# (.secrets/<slug>.session, .secrets/<slug>.db).
#
# ⚠️ ДВА ВКЛЮЧЁННЫХ КЛИЕНТА НЕ МОГУТ ДЕЛИТЬ session ИЛИ db — валидация
# отклонит обоих. Два процесса на одной Telethon-сессии = гонка за запись
# .session вплоть до разлогина аккаунта.
#
# Наблюдаемое состояние (кто живёт на самом деле) — state/chatter_clients.json.
# Старт/стоп клиента: scripts\chatter_client.ps1 -Slug <s> -Action start|stop
clients:
  # 🔴 У volska НЕТ инстанса клиентской панели, и это ИЗВЕСТНОЕ состояние, а не
  # нормальное (решение владельца 25.08.2026, DEV-77). Следствие видно в лампах:
  # `escalation:volska` в ops_watchdog горит `no_instance` непрерывно — спросить
  # об эскалациях некого. Гасить её ЗАПРЕЩЕНО: из четырёх непрочитанных карточек
  # ТРИ принадлежат volska, включая самую старую (26.6 суток на момент замера),
  # то есть тишина пришлась бы ровно на место проблемы. Лечится не пробой, а
  # вторым инстансом — отдельной аркой. volska — прототип, но карточки от неё
  # РЕАЛЬНЫЕ.
  volska:
    enabled: true
    personas: [volska]
    session: .secrets/demo.session   # пин: volska живёт на сессии demo-аккаунта
    db: .secrets/demo.db

  demo:
    enabled: false                   # взаимоисключим с volska: тот же аккаунт
    personas: [demo, demo2]
    session: .secrets/demo.session
    db: .secrets/demo.db

  # Ярина — ОТДЕЛЬНЫЙ аккаунт (доп. номер владельца), а НЕ подмена состава на
  # аккаунте Ольги: демо 14.08 крутилось именно так, и это ровно тот механизм,
  # который арка убрала. Пути свои, с volska ничего не делит.
  #
  # enabled: false ДО завершения онбординга. Порядок обязателен:
  #   1) интерактивный логин -> .secrets/yarina.session.enc
  #   2) пересъём бандла секретов (§12) — иначе в бэкапе мёртвый auth
  #   3) CHATTER_CONTROL_BOT_TOKEN_YARINA в окружении (свой бот, см. ниже)
  #   4) дрилы 1-7 из ONBOARDING_MANUAL §5
  #   5) только тогда enabled: true + рестарт ТАСКА гардиана
  # Включить раньше — гардиан будет циклично пытаться поднять раннер без
  # сессии; registry_cli отдаст runnable=false с ошибкой про сессию.
  yarina:
    enabled: true
    personas: [yarina]
    session: .secrets/yarina.session
    db: .secrets/yarina.db
