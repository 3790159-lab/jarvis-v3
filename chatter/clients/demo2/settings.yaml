# СТОИТ sonnet-5, и это НЕ «дороже ради качества» — это ДЕШЕВЛЕ.
# Стабильный префикс классификатора у demo2 — 2293 токенов по haiku-4-5
# (замер 19.08 в боевой форме, со слотом обязательств), а порог включения
# prompt-кэша у haiku — 4096. Ниже порога кэш выключается МОЛЧА: ни ошибки,
# ни лога, единственный след — cache_creation_input_tokens == 0, и каждый
# вызов платит полный вход вместо чтения по 0.1×. Втрое дешёвый токен не
# окупает десятикратный вход. У sonnet-5 порог 1024, префикс по его
# токенизатору 2879 — кэш работает.
# Вернуть haiku можно, только нарастив плейбук demo2 выше 4096 токенов;
# иначе сторож §2.2 (chatter/core/prefix_budget.py) откажется поднимать
# клиента — и будет прав.
model: claude-sonnet-5
language: en
owner_id: "Alex"
persona_name: "Dmitry"
currency: "USD"
work_hours: {start: 9, end: 18}
timings:
  read_delay_min: 1.5
  read_delay_max: 4.0
  cps_min: 4.0
  cps_max: 7.0
  jitter_min: 0.9
  jitter_max: 1.2
  split_pause_min: 0.6
  split_pause_max: 1.8
  split_max_len: 160
  night_multiplier: 2.5
  debounce_window: 3.0
  debounce_max: 15.0
limits: {max_reply_tokens: 20000, per_contact_hourly: 20, daily_cap: 500}
