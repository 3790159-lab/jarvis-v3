# ЭТАЛОНЫ РАЗМЕРА СТАБИЛЬНОГО ПРЕФИКСА brain — спека 2026-08-19 §9.
#
# ЭТУ СТРОКУ ПОДНИМАЕТ ЧЕЛОВЕК. Осознанной правкой, коммитом, с ревью.
# Ни один код в репозитории не пишет в этот файл — это главное требование §9.2,
# и оно не «для аккуратности». Эталон, который обновляет себя сам, догонял бы
# дрейф и всегда молчал: он воспроизвёл бы РОВНО тот дефект, ради которого
# сторож поставлен. За месяц (июль→август 2026) префикс brain распух на треть
# по чуть-чуть от каждой арки, цена вызова выросла ×1.63, полоса тарифа съехала
# 790 → 653 диалога в месяц — и об этом узнали случайно, при пересчёте.
#
# Сторож кричит владельцу, когда замер превысил эталон больше чем на
# threshold_percent. Это НЕ отказ поднимать клиента: рост бывает законным —
# клиент правит свой плейбук через пульт. Услышал, посмотрел, решил: срезать
# промпт или поднять эталон.
#
# measured_with — модель, КОТОРОЙ снят эталон, и ею же обязан считаться замер.
# Токенизаторы sonnet-5 и haiku-4-5 расходятся на 7–12% (§2.0 спеки), то есть
# на величину порядка самого порога: посчитать чужой моделью значит получить
# две трети «дрейфа» на ровном месте. У demo brain работает на haiku, но эталон
# ниже снят sonnet'ом — и это не ошибка: дрейф есть ОТНОШЕНИЕ, важно не «какая
# модель правильная», а «та же, что у эталона».
#
# Числа ниже — замер 19.08.2026 (`messages.count_tokens`, $0), §9.3 спеки,
# перенесены БЕЗ пересчёта.
#
# Как поднять эталон руками:
#   1. посчитать префикс той же моделью, что стоит в measured_with;
#   2. заменить brain новым числом и measured_on — датой ЭТОГО замера;
#   3. в сообщении коммита назвать, ЧТО выросло и почему это законно.

threshold_percent: 15          # N% — решение владельца 19.08 (§9.4)

# ПРАВКА 19.08, срезка пункта (а) — спека 2026-08-19-playbook-trim.
#
# Числа УМЕНЬШИЛИСЬ, и это единственный случай, когда эталон обязан правиться
# СРОЧНО. Сторож ловит только РОСТ (превышение предела): после срезки он на
# старом эталоне ПРОМОЛЧАЛ БЫ — и молчал бы дальше, пока префикс не отрастёт
# обратно на 15% от СТАРОГО, то есть на ~1.7 тысячи токенов сверх нового
# размера. Незамеченный дрейф в полторы тысячи токенов — ровно та беда, ради
# которой §9 и написан. Поэтому правка эталона едет ОДНИМ коммитом со срезкой
# (требование владельца 19.08), а не «потом, когда посмотрим».
#
# Что вырезано: секция `## Ключові слова ескалації` из ТЕКСТА, уходящего в
# модель (в файле плейбука она остаётся — она источник для
# `escalation.parse_escalation_keywords`). Замер тем же зондом и той же
# моделью, что прежние числа.
#
#   было → стало (дельта):  volska 9131 → 8586 (−545)
#                           yarina 14847 → 13869 (−978)
#                           demo   2394 → 2200 (−194)
clients:
  volska: {brain: 8586,  measured_with: claude-sonnet-5, measured_on: "2026-08-19"}
  yarina: {brain: 13869, measured_with: claude-sonnet-5, measured_on: "2026-08-19"}
  demo:   {brain: 2200,  measured_with: claude-sonnet-5, measured_on: "2026-08-19"}
