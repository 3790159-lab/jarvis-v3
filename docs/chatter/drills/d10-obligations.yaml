# Сценарий Д-10 (слот обязательств) в машинном виде.
# Читается как диалог — это условие: как только сценарий превращается в код,
# его перестают править. Проверки — из закрытого словаря chatter/core/drill.py.
name: Д-10 слот обязательств
client: volska
contact: "237616472:volska"
steps:
  - say: "Ми вирішили - робимо новий логотип з нуля, не ребрендинг"
    expect:
      # Первый ход после смены префикса ОБЯЗАН быть промахом — это плата за
      # новый кэш, а не провал.
      cache: miss
      profile_contains: ["новий лого"]
      classifier_errors: 0
      no_duplicate_reply: true

  - say: "А що саме входить у вартість?"
    expect:
      # Главный критерий приёмки арки кэша: префикс пережил ход вместе с
      # переписанным профилем.
      cache: hit
      obligations_unchanged: true
      classifier_errors: 0
      no_duplicate_reply: true

  - say: "Добре, давайте оформлювати оплату"
    expect:
      cache: hit
      card_delivered: true
      obligations: { owner_write: delivered }
      classifier_errors: 0

  - say: "Дякую, чекаю"
    expect:
      cache: hit
      obligations: { brief: delivered, owner_write: delivered }
      classifier_errors: 0
      no_duplicate_reply: true
