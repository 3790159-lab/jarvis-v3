# Сценарий Д-10 (слот обязательств) в машинном виде.
# Читается как диалог — это условие: как только сценарий превращается в код,
# его перестают править. Проверки — из закрытого словаря chatter/core/drill.py.
#
# Переписан 2026-08-06 под ЧИСТЫЙ контакт (спека
# docs/superpowers/specs/2026-08-06-d10-clean-contact-scenario.md). Причина:
# стенд сбрасывает контакт перед КАЖДЫМ прогоном по конструкции, поэтому
# «истории» не существует — есть только осадок прошлого прогона, и сценарий,
# который на него опирался, не был регрессионным. Теперь дрил заводит все
# нужные долги сам первыми шагами и закрывает последними.
#
# 🔴 Шаги 3, 4 и 6 обязаны КРАСНЕТЬ, пока не починены P21/P22 (находки прогона
# 06.08, docs/chatter/PROBLEMS.md). Это ожидаемый результат: тест должен уметь
# покраснеть на дефекте ДО того, как дефект убран, иначе зелёный ни о чём.
name: Д-10 слот обязательств
client: volska
# Дефолт ручного прогона. Ночной регресс всё равно передаёт контакт явно
# (--contact, dd19cabb). Прежний дефолт 237616472:volska снят: он в состоянии
# `dead` — терминальное, воронка из него не двигается.
contact: "telegram:8849893367:volska"
steps:
  - say: "Ми вирішили - робимо новий логотип з нуля, не ребрендинг"
    expect:
      # Первый ход после сброса ОБЯЗАН быть промахом — это плата за новый
      # кэш, а не провал.
      cache: miss
      # «ребрендинг» произнёс ЛИД. Прежнее «новий лого» было конструкцией
      # БОТА — проверка ловила формулировку модели, а не память о факте.
      profile_contains: ["ребрендинг"]
      classifier_errors: 0
      no_duplicate_reply: true

  - say: "А що саме входить у вартість?"
    expect:
      # Главный критерий приёмки арки кэша: префикс пережил ход вместе с
      # переписанным профилем.
      cache: hit
      # Контракт промпта: brief закрывается ЗАДАННЫМИ вопросами, а не
      # полученным ответом. На чистом слоте это проверяемо и не вакуумно.
      obligations: { brief: delivered }
      obligations_unchanged: true
      classifier_errors: 0
      no_duplicate_reply: true

  # Сторож против ПЕРЕОТКРЫТИЯ brief. Ровно тот ход, на котором бот отклонился
  # 06.08: получив ответ клиента, классификатор вернул brief в open с detail
  # «чекаємо відповідь клієнта…» — случай, запрещённый промптом дословно (P21).
  - say: "Сфера — кав'ярня, назва вже є, кольори не визначені"
    expect:
      cache: hit
      obligations: { brief: delivered }
      classifier_errors: 0
      no_duplicate_reply: true

  # Пересчёт УЖЕ названной цены, а не запрос новой позиции: ответ остаётся
  # внутри вилки 300–400 $, которая есть в knowledge.md дословно, поэтому
  # guardrails не срежут число как необеспеченное (P20). `recalc` каноничен —
  # анти-фрагментация other к нему не применяется.
  - say: "А якщо потрібно три варіанти концепції замість одного — це вплине на ціну?"
    expect:
      cache: hit
      # Бот может назвать вилку тем же ходом или зафиксировать запрос — оба
      # исхода законны по промпту, «нет в слоте» остаётся красным (P22).
      obligations: { recalc: "open|delivered" }
      classifier_errors: 0
      no_duplicate_reply: true

  # Тап владельца НЕ требуется: owner_write закрывает КОД по факту доставленной
  # карточки (chatter/run.py:424). 06.08 шаг зелёный целиком.
  - say: "Добре, давайте оформлювати оплату"
    expect:
      cache: hit
      card_delivered: true
      obligations: { owner_write: delivered }
      classifier_errors: 0

  - say: "Дякую, чекаю"
    expect:
      cache: hit
      # Единственная сводная проверка слота. Все три долга заведены В ЭТОМ ЖЕ
      # прогоне и обязаны быть закрыты к финалу.
      obligations: { recalc: delivered, brief: delivered, owner_write: delivered }
      classifier_errors: 0
      no_duplicate_reply: true
