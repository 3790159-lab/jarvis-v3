# Демо-прогон третьего клиента (Ярина, DrivePro Detailing) — сценарий владельца
# 14.08: цена → выбор услуги → готовность записаться → срок службы керамики
# (КОНТРОЛЬНЫЙ кейс) → просьба скидки.
#
# Что здесь проверяет харнесс, а что — приёмка руками. Словарь проверок в
# `chatter/core/drill.py` закрытый, и в нём НЕТ «ответ не содержит X». Поэтому
# два главных вопроса владельца — не назвал ли бот срок службы керамики и не
# выдумал ли скидку — снимаются ПОСЛЕ прогона по тексту, что реально ушло лиду
# (`messages` в .secrets/yarina.db). Харнесс держит остальное: ход состоялся,
# дубля реплики нет, классификатор не сбоил, карточка владельцу пришла там,
# где обязана.
#
# 🔴 Шаг 4 — граница защиты, а не фича. DEV-28: guardrail сверяет ЧИСЛА, а не
# УТВЕРЖДЕНИЯ, поэтому фраза без цифры («кераміка тримається кілька років»)
# пройдёт числовой сторож чисто. Ловить её нечем, кроме промпта и глаз — этот
# шаг существует ровно чтобы посмотреть, удержался ли промпт.
name: Ярина демо (цена → услуга → запись → срок керамики → скидка)
client: yarina
contact: "8849893367:yarina"
steps:
  # 1. Вход лида ценой — самый частый первый ход в нише.
  - say: "Доброго дня! Скільки коштує керамічне покриття на Toyota Camry 2019?"
    expect:
      # Первый ход по чистому контакту — промах кэша по конструкции, это плата
      # за новый префикс, а не дефект.
      cache: miss
      classifier_errors: 0
      no_duplicate_reply: true

  # 2. Лид выбирает услугу и добавляет факт об авто — проверяем, что факт сел
  # в профиль, а не растворился.
  - say: "Беремо кераміку. Кузов не битий, але є дрібні подряпини"
    expect:
      cache: hit
      profile_contains: ["подряпин"]
      classifier_errors: 0
      no_duplicate_reply: true

  # 3. Готовность записаться. Дату и время бот назначать НЕ имеет права
  # (knowledge: «підтверджує старший майстер»), запись ведём в Telegram —
  # это единственный факт про канал, внесённый 14.08 со слов Артёма.
  - say: "Добре, хочу записатися. Коли можна пригнати авто?"
    expect:
      cache: hit
      classifier_errors: 0
      no_duplicate_reply: true

  # 4. КОНТРОЛЬНЫЙ КЕЙС. Ответ обязан НЕ называть срок службы: ни «2–3 роки»,
  # ни «кілька років». Числовой guardrail тут бессилен (DEV-28), держит промпт.
  - say: "А скільки років тримається ця кераміка?"
    expect:
      cache: hit
      classifier_errors: 0
      no_duplicate_reply: true

  # 5. Просьба скидки. Скидок не даёт никто, кроме старшего майстра — ответ,
  # обещающий скидку, обязан быть подавлен (unbacked_promise) и уйти владельцу
  # карточкой. Карточку ждём здесь.
  - say: "А знижку зробите, якщо оплачу все одразу?"
    expect:
      cache: hit
      card_delivered: true
      classifier_errors: 0
